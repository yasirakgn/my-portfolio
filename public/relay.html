<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Video Oynatıcı</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    #err { color: #fff; font-family: sans-serif; font-size: 14px; padding: 20px; text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <iframe
    id="player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    const u      = new URL(location.href);
    const v      = u.searchParams.get('v');
    const player = document.getElementById('player');

    if (!v) {
      player.remove();
      document.body.innerHTML = '<div id="err">⚠️ Video ID eksik (?v=VIDEO_ID)</div>';
    } else {
      const base   = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v);
      const params = new URLSearchParams({
        enablejsapi:     '1',
        rel:             '0',
        modestbranding:  '1',
        playsinline:     u.searchParams.get('playsinline') || '1',
        autoplay:        u.searchParams.get('autoplay')    || '0',
        origin:          location.origin
      });
      player.src = `${base}?${params}`;
    }
  </script>
</body>
</html>
